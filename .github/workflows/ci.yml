name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  python-syntax:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 编译检查 tools/ 脚本
        run: python -m compileall tools/

  markdown-lint:
    name: Markdown 检查
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: 'docs/**/*.md'
